services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mineguard
      POSTGRES_USER: mineguard
      POSTGRES_PASSWORD: ${MINEGUARD_DB_PASSWORD:?Set a strong database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mineguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    restart: on-failure
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "app.migrate"]
    environment:
      MINEGUARD_ENVIRONMENT: production
      MINEGUARD_SECRET_KEY: ${MINEGUARD_SECRET_KEY:?Set a random secret of at least 32 characters}
      MINEGUARD_DOCS_ENABLED: "false"
      MINEGUARD_DATABASE_URL: ${MINEGUARD_DATABASE_URL:?Set the PostgreSQL connection URL}
      MINEGUARD_DATABASE_CONNECT_TIMEOUT_SECONDS: ${MINEGUARD_DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      MINEGUARD_DATABASE_POOL_TIMEOUT_SECONDS: ${MINEGUARD_DATABASE_POOL_TIMEOUT_SECONDS:-10}
      MINEGUARD_DATABASE_POOL_RECYCLE_SECONDS: ${MINEGUARD_DATABASE_POOL_RECYCLE_SECONDS:-300}
      MINEGUARD_BOOTSTRAP_ADMIN_ENABLED: "true"
      MINEGUARD_BOOTSTRAP_ADMIN_PASSWORD: ${MINEGUARD_BOOTSTRAP_ADMIN_PASSWORD:?Set a strong bootstrap administrator password}
      MINEGUARD_CAMERA_URL_KEY: ${MINEGUARD_CAMERA_URL_KEY:?Set a base64-encoded 32-byte camera URL key}
      MINEGUARD_CAMERA_URL_KEY_VERSION: ${MINEGUARD_CAMERA_URL_KEY_VERSION:-v1}
      MINEGUARD_CAMERA_URL_PREVIOUS_KEYS: '${MINEGUARD_CAMERA_URL_PREVIOUS_KEYS:?Set a JSON object, use {} when no previous keys exist}'
      MINEGUARD_CORS_ORIGINS: '[]'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  api:
    build: ./backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MINEGUARD_ENVIRONMENT: production
      MINEGUARD_SECRET_KEY: ${MINEGUARD_SECRET_KEY:?Set a random secret of at least 32 characters}
      MINEGUARD_DOCS_ENABLED: "false"
      MINEGUARD_DATABASE_URL: ${MINEGUARD_DATABASE_URL:?Set the PostgreSQL connection URL}
      MINEGUARD_DATABASE_CONNECT_TIMEOUT_SECONDS: ${MINEGUARD_DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      MINEGUARD_DATABASE_POOL_TIMEOUT_SECONDS: ${MINEGUARD_DATABASE_POOL_TIMEOUT_SECONDS:-10}
      MINEGUARD_DATABASE_POOL_RECYCLE_SECONDS: ${MINEGUARD_DATABASE_POOL_RECYCLE_SECONDS:-300}
      MINEGUARD_BOOTSTRAP_ADMIN_ENABLED: "false"
      MINEGUARD_CAMERA_URL_KEY: ${MINEGUARD_CAMERA_URL_KEY:?Set a base64-encoded 32-byte camera URL key}
      MINEGUARD_CAMERA_URL_KEY_VERSION: ${MINEGUARD_CAMERA_URL_KEY_VERSION:-v1}
      MINEGUARD_CAMERA_URL_PREVIOUS_KEYS: '${MINEGUARD_CAMERA_URL_PREVIOUS_KEYS:?Set a JSON object, use {} when no previous keys exist}'
      MINEGUARD_CORS_ORIGINS: '${MINEGUARD_CORS_ORIGINS:-[]}'
      MINEGUARD_LOCAL_LOGIN_ENABLED: ${MINEGUARD_LOCAL_LOGIN_ENABLED:-true}
      MINEGUARD_OIDC_ENABLED: ${MINEGUARD_OIDC_ENABLED:-false}
      MINEGUARD_OIDC_PROVIDER_ID: ${MINEGUARD_OIDC_PROVIDER_ID:-enterprise-oidc}
      MINEGUARD_OIDC_PROVIDER_LABEL: ${MINEGUARD_OIDC_PROVIDER_LABEL:-Enterprise SSO}
      MINEGUARD_OIDC_ISSUER: ${MINEGUARD_OIDC_ISSUER:-}
      MINEGUARD_OIDC_DISCOVERY_URL: ${MINEGUARD_OIDC_DISCOVERY_URL:-}
      MINEGUARD_OIDC_CLIENT_ID: ${MINEGUARD_OIDC_CLIENT_ID:-}
      MINEGUARD_OIDC_CLIENT_SECRET: ${MINEGUARD_OIDC_CLIENT_SECRET:-}
      MINEGUARD_OIDC_REDIRECT_URI: ${MINEGUARD_OIDC_REDIRECT_URI:-}
      MINEGUARD_OIDC_POST_LOGIN_URL: ${MINEGUARD_OIDC_POST_LOGIN_URL:-}
      MINEGUARD_OIDC_SCOPES: ${MINEGUARD_OIDC_SCOPES:-openid profile email groups}
      MINEGUARD_OIDC_ENDPOINT_ALLOWED_ORIGINS: '${MINEGUARD_OIDC_ENDPOINT_ALLOWED_ORIGINS:-[]}'
      MINEGUARD_OIDC_ROLE_MAPPING: '${MINEGUARD_OIDC_ROLE_MAPPING:-{}}'
      MINEGUARD_OIDC_AREA_MAPPING: '${MINEGUARD_OIDC_AREA_MAPPING:-{}}'
      MINEGUARD_OIDC_DEFAULT_AREAS: '${MINEGUARD_OIDC_DEFAULT_AREAS:-[]}'
      MINEGUARD_OIDC_DEFAULT_ROLE: ${MINEGUARD_OIDC_DEFAULT_ROLE:-auditor}
      MINEGUARD_OIDC_ALLOWED_GROUPS: '${MINEGUARD_OIDC_ALLOWED_GROUPS:-[]}'
      MINEGUARD_OIDC_AUTO_PROVISION: ${MINEGUARD_OIDC_AUTO_PROVISION:-false}
      MINEGUARD_FACE_ENABLED: ${MINEGUARD_FACE_ENABLED:-false}
      MINEGUARD_FACE_INFERENCE_URL: ${MINEGUARD_FACE_INFERENCE_URL:-}
      MINEGUARD_FACE_TEMPLATE_KEY: ${MINEGUARD_FACE_TEMPLATE_KEY:-}
      MINEGUARD_FACE_TEMPLATE_KEY_VERSION: ${MINEGUARD_FACE_TEMPLATE_KEY_VERSION:-v1}
      MINEGUARD_FACE_TEMPLATE_PREVIOUS_KEYS: '${MINEGUARD_FACE_TEMPLATE_PREVIOUS_KEYS:?Set a JSON object, use {} when no previous keys exist}'
      MINEGUARD_FACE_REQUEST_TIMEOUT_SECONDS: ${MINEGUARD_FACE_REQUEST_TIMEOUT_SECONDS:-10}
      MINEGUARD_FACE_MIN_QUALITY: ${MINEGUARD_FACE_MIN_QUALITY:-0.65}
      MINEGUARD_FACE_MIN_LIVENESS: ${MINEGUARD_FACE_MIN_LIVENESS:-0.80}
      MINEGUARD_FACE_MATCH_THRESHOLD: ${MINEGUARD_FACE_MATCH_THRESHOLD:-0.72}
      MINEGUARD_MAX_FACE_IMAGE_BYTES: ${MINEGUARD_MAX_FACE_IMAGE_BYTES:-8388608}
      MINEGUARD_NOTIFICATION_GATEWAY_URL: ${MINEGUARD_NOTIFICATION_GATEWAY_URL:-}
      MINEGUARD_NOTIFICATION_GATEWAY_TOKEN: ${MINEGUARD_NOTIFICATION_GATEWAY_TOKEN:-}
      MINEGUARD_ENFORCE_APPROVED_EDGE_MODELS: "true"
      MINEGUARD_REQUIRE_FOUR_EYES_MODEL_APPROVAL: "true"
      MINEGUARD_REALTIME_STREAM_POLL_SECONDS: ${MINEGUARD_REALTIME_STREAM_POLL_SECONDS:-1}
      MINEGUARD_REALTIME_STREAM_MAX_SECONDS: ${MINEGUARD_REALTIME_STREAM_MAX_SECONDS:-600}
      MINEGUARD_REALTIME_SIGNAL_RETENTION_HOURS: ${MINEGUARD_REALTIME_SIGNAL_RETENTION_HOURS:-24}
      MINEGUARD_REFRESH_SESSION_RETENTION_DAYS: ${MINEGUARD_REFRESH_SESSION_RETENTION_DAYS:-7}
      MINEGUARD_NOTIFICATION_DELIVERY_RETENTION_DAYS: ${MINEGUARD_NOTIFICATION_DELIVERY_RETENTION_DAYS:-90}
      MINEGUARD_CLOSED_EVENT_RETENTION_DAYS: ${MINEGUARD_CLOSED_EVENT_RETENTION_DAYS:-365}
      MINEGUARD_EVENT_SNAPSHOT_RETENTION_DAYS: ${MINEGUARD_EVENT_SNAPSHOT_RETENTION_DAYS:-90}
      MINEGUARD_SNAPSHOT_STORAGE_ENABLED: ${MINEGUARD_SNAPSHOT_STORAGE_ENABLED:-false}
      MINEGUARD_SNAPSHOT_STORAGE_ENDPOINT_URL: ${MINEGUARD_SNAPSHOT_STORAGE_ENDPOINT_URL:-}
      MINEGUARD_SNAPSHOT_STORAGE_BUCKET: ${MINEGUARD_SNAPSHOT_STORAGE_BUCKET:-}
      MINEGUARD_SNAPSHOT_STORAGE_REGION: ${MINEGUARD_SNAPSHOT_STORAGE_REGION:-us-east-1}
      MINEGUARD_SNAPSHOT_STORAGE_ACCESS_KEY_ID: ${MINEGUARD_SNAPSHOT_STORAGE_ACCESS_KEY_ID:-}
      MINEGUARD_SNAPSHOT_STORAGE_SECRET_ACCESS_KEY: ${MINEGUARD_SNAPSHOT_STORAGE_SECRET_ACCESS_KEY:-}
      MINEGUARD_SNAPSHOT_STORAGE_FORCE_PATH_STYLE: ${MINEGUARD_SNAPSHOT_STORAGE_FORCE_PATH_STYLE:-false}
      MINEGUARD_SNAPSHOT_STORAGE_PRESIGN_SECONDS: ${MINEGUARD_SNAPSHOT_STORAGE_PRESIGN_SECONDS:-300}
      MINEGUARD_SNAPSHOT_STORAGE_MAXIMUM_BYTES: ${MINEGUARD_SNAPSHOT_STORAGE_MAXIMUM_BYTES:-8388608}
      MINEGUARD_SNAPSHOT_STORAGE_CONNECT_TIMEOUT_SECONDS: ${MINEGUARD_SNAPSHOT_STORAGE_CONNECT_TIMEOUT_SECONDS:-3}
      MINEGUARD_SNAPSHOT_STORAGE_READ_TIMEOUT_SECONDS: ${MINEGUARD_SNAPSHOT_STORAGE_READ_TIMEOUT_SECONDS:-5}
      MINEGUARD_SNAPSHOT_STORAGE_TOTAL_ATTEMPTS: ${MINEGUARD_SNAPSHOT_STORAGE_TOTAL_ATTEMPTS:-1}
      MINEGUARD_AUDIT_LOG_RETENTION_DAYS: ${MINEGUARD_AUDIT_LOG_RETENTION_DAYS:-2555}
      MINEGUARD_INACTIVE_FACE_TEMPLATE_RETENTION_DAYS: ${MINEGUARD_INACTIVE_FACE_TEMPLATE_RETENTION_DAYS:-30}
      MINEGUARD_SERVICE_HEARTBEAT_RETENTION_DAYS: ${MINEGUARD_SERVICE_HEARTBEAT_RETENTION_DAYS:-7}
      MINEGUARD_LIFECYCLE_CLEANUP_INTERVAL_SECONDS: ${MINEGUARD_LIFECYCLE_CLEANUP_INTERVAL_SECONDS:-3600}
      MINEGUARD_LIFECYCLE_CLEANUP_BATCH_SIZE: ${MINEGUARD_LIFECYCLE_CLEANUP_BATCH_SIZE:-5000}
      MINEGUARD_WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${MINEGUARD_WORKER_HEARTBEAT_TIMEOUT_SECONDS:-60}
      MINEGUARD_NOTIFICATION_QUEUE_STALE_SECONDS: ${MINEGUARD_NOTIFICATION_QUEUE_STALE_SECONDS:-300}
      MINEGUARD_RECONNECT_STORM_THRESHOLD: ${MINEGUARD_RECONNECT_STORM_THRESHOLD:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
      - control
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: ./backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "app.worker"]
    environment:
      MINEGUARD_ENVIRONMENT: production
      MINEGUARD_SECRET_KEY: ${MINEGUARD_SECRET_KEY:?Set a random secret of at least 32 characters}
      MINEGUARD_DOCS_ENABLED: "false"
      MINEGUARD_DATABASE_URL: ${MINEGUARD_DATABASE_URL:?Set the PostgreSQL connection URL}
      MINEGUARD_DATABASE_CONNECT_TIMEOUT_SECONDS: ${MINEGUARD_DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      MINEGUARD_DATABASE_POOL_TIMEOUT_SECONDS: ${MINEGUARD_DATABASE_POOL_TIMEOUT_SECONDS:-10}
      MINEGUARD_DATABASE_POOL_RECYCLE_SECONDS: ${MINEGUARD_DATABASE_POOL_RECYCLE_SECONDS:-300}
      MINEGUARD_BOOTSTRAP_ADMIN_ENABLED: "false"
      MINEGUARD_CAMERA_URL_KEY: ${MINEGUARD_CAMERA_URL_KEY:?Set a base64-encoded 32-byte camera URL key}
      MINEGUARD_CAMERA_URL_KEY_VERSION: ${MINEGUARD_CAMERA_URL_KEY_VERSION:-v1}
      MINEGUARD_CAMERA_URL_PREVIOUS_KEYS: '${MINEGUARD_CAMERA_URL_PREVIOUS_KEYS:?Set a JSON object, use {} when no previous keys exist}'
      MINEGUARD_CORS_ORIGINS: '${MINEGUARD_CORS_ORIGINS:-[]}'
      MINEGUARD_NOTIFICATION_GATEWAY_URL: ${MINEGUARD_NOTIFICATION_GATEWAY_URL:-}
      MINEGUARD_NOTIFICATION_GATEWAY_TOKEN: ${MINEGUARD_NOTIFICATION_GATEWAY_TOKEN:-}
      MINEGUARD_MEDIA_GATEWAY_API_URL: http://172.31.250.2:9997
      MINEGUARD_MEDIA_GATEWAY_TIMEOUT_SECONDS: ${MINEGUARD_MEDIA_GATEWAY_TIMEOUT_SECONDS:-5}
      MINEGUARD_MEDIA_RECONCILE_INTERVAL_SECONDS: ${MINEGUARD_MEDIA_RECONCILE_INTERVAL_SECONDS:-30}
      MINEGUARD_ENFORCE_APPROVED_EDGE_MODELS: "true"
      MINEGUARD_REQUIRE_FOUR_EYES_MODEL_APPROVAL: "true"
      MINEGUARD_REALTIME_SIGNAL_RETENTION_HOURS: ${MINEGUARD_REALTIME_SIGNAL_RETENTION_HOURS:-24}
      MINEGUARD_REFRESH_SESSION_RETENTION_DAYS: ${MINEGUARD_REFRESH_SESSION_RETENTION_DAYS:-7}
      MINEGUARD_NOTIFICATION_DELIVERY_RETENTION_DAYS: ${MINEGUARD_NOTIFICATION_DELIVERY_RETENTION_DAYS:-90}
      MINEGUARD_CLOSED_EVENT_RETENTION_DAYS: ${MINEGUARD_CLOSED_EVENT_RETENTION_DAYS:-365}
      MINEGUARD_EVENT_SNAPSHOT_RETENTION_DAYS: ${MINEGUARD_EVENT_SNAPSHOT_RETENTION_DAYS:-90}
      MINEGUARD_SNAPSHOT_STORAGE_ENABLED: ${MINEGUARD_SNAPSHOT_STORAGE_ENABLED:-false}
      MINEGUARD_SNAPSHOT_STORAGE_ENDPOINT_URL: ${MINEGUARD_SNAPSHOT_STORAGE_ENDPOINT_URL:-}
      MINEGUARD_SNAPSHOT_STORAGE_BUCKET: ${MINEGUARD_SNAPSHOT_STORAGE_BUCKET:-}
      MINEGUARD_SNAPSHOT_STORAGE_REGION: ${MINEGUARD_SNAPSHOT_STORAGE_REGION:-us-east-1}
      MINEGUARD_SNAPSHOT_STORAGE_ACCESS_KEY_ID: ${MINEGUARD_SNAPSHOT_STORAGE_ACCESS_KEY_ID:-}
      MINEGUARD_SNAPSHOT_STORAGE_SECRET_ACCESS_KEY: ${MINEGUARD_SNAPSHOT_STORAGE_SECRET_ACCESS_KEY:-}
      MINEGUARD_SNAPSHOT_STORAGE_FORCE_PATH_STYLE: ${MINEGUARD_SNAPSHOT_STORAGE_FORCE_PATH_STYLE:-false}
      MINEGUARD_SNAPSHOT_STORAGE_PRESIGN_SECONDS: ${MINEGUARD_SNAPSHOT_STORAGE_PRESIGN_SECONDS:-300}
      MINEGUARD_SNAPSHOT_STORAGE_MAXIMUM_BYTES: ${MINEGUARD_SNAPSHOT_STORAGE_MAXIMUM_BYTES:-8388608}
      MINEGUARD_SNAPSHOT_STORAGE_CONNECT_TIMEOUT_SECONDS: ${MINEGUARD_SNAPSHOT_STORAGE_CONNECT_TIMEOUT_SECONDS:-3}
      MINEGUARD_SNAPSHOT_STORAGE_READ_TIMEOUT_SECONDS: ${MINEGUARD_SNAPSHOT_STORAGE_READ_TIMEOUT_SECONDS:-5}
      MINEGUARD_SNAPSHOT_STORAGE_TOTAL_ATTEMPTS: ${MINEGUARD_SNAPSHOT_STORAGE_TOTAL_ATTEMPTS:-1}
      MINEGUARD_AUDIT_LOG_RETENTION_DAYS: ${MINEGUARD_AUDIT_LOG_RETENTION_DAYS:-2555}
      MINEGUARD_INACTIVE_FACE_TEMPLATE_RETENTION_DAYS: ${MINEGUARD_INACTIVE_FACE_TEMPLATE_RETENTION_DAYS:-30}
      MINEGUARD_SERVICE_HEARTBEAT_RETENTION_DAYS: ${MINEGUARD_SERVICE_HEARTBEAT_RETENTION_DAYS:-7}
      MINEGUARD_LIFECYCLE_CLEANUP_INTERVAL_SECONDS: ${MINEGUARD_LIFECYCLE_CLEANUP_INTERVAL_SECONDS:-3600}
      MINEGUARD_LIFECYCLE_CLEANUP_BATCH_SIZE: ${MINEGUARD_LIFECYCLE_CLEANUP_BATCH_SIZE:-5000}
      MINEGUARD_WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${MINEGUARD_WORKER_HEARTBEAT_TIMEOUT_SECONDS:-60}
      MINEGUARD_NOTIFICATION_QUEUE_STALE_SECONDS: ${MINEGUARD_NOTIFICATION_QUEUE_STALE_SECONDS:-300}
      MINEGUARD_RECONNECT_STORM_THRESHOLD: ${MINEGUARD_RECONNECT_STORM_THRESHOLD:-10}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - data
      - control
      - media-control

  media-gateway:
    image: bluenviron/mediamtx:1.14.0
    restart: unless-stopped
    init: true
    environment:
      MTX_APIADDRESS: 172.31.250.2:9997
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    networks:
      media: {}
      media-control:
        ipv4_address: 172.31.250.2

  web:
    build: ./frontend
    restart: unless-stopped
    init: true
    environment:
      NGINX_ENVSUBST_FILTER: ^MINEGUARD_SNAPSHOT_CSP_ORIGIN$
      MINEGUARD_SNAPSHOT_CSP_ORIGIN: ${MINEGUARD_SNAPSHOT_CSP_ORIGIN:-}
    depends_on:
      - api
      - media-gateway
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - control
      - media
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  data:
    internal: true
  control:
  media:
  media-control:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/24
