limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/m;
limit_req_zone "$binary_remote_addr:$http_x_edge_node" zone=edge_per_node:10m rate=200r/s;
limit_conn_zone $binary_remote_addr zone=sse_per_ip:10m;
log_format mineguard '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_user_agent" request_id=$request_id';
access_log /var/log/nginx/access.log mineguard;

resolver 127.0.0.11 valid=10s ipv6=off;
upstream mineguard_api {
  zone mineguard_api 64k;
  server api:8000 resolve;
  keepalive 32;
}
upstream mineguard_media {
  zone mineguard_media 64k;
  server media-gateway:8888 resolve;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 9m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: ${MINEGUARD_SNAPSHOT_CSP_ORIGIN}; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /api/v1/auth/login {
    limit_req zone=login_per_ip burst=5 nodelay;
    proxy_pass http://mineguard_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /api/v1/auth/oidc/login {
    limit_req zone=login_per_ip burst=5 nodelay;
    proxy_pass http://mineguard_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /api/v1/realtime/stream {
    limit_req zone=api_per_ip burst=10 nodelay;
    limit_conn sse_per_ip 20;
    proxy_pass http://mineguard_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 12m;
  }

  location /api/v1/edge/ {
    limit_req zone=edge_per_node burst=400 nodelay;
    proxy_pass http://mineguard_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location /api/ {
    limit_req zone=api_per_ip burst=40 nodelay;
    proxy_pass http://mineguard_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location /media/ {
    auth_request /_media_auth;
    proxy_pass http://mineguard_media/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;
  }

  location = /_media_auth {
    internal;
    proxy_pass http://mineguard_api/api/v1/media/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /api/v1/media/authorize {
    return 404;
  }

  location = /internal/metrics {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
