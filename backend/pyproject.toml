[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mineguard-api"
version = "0.1.0"
description = "Mine production intelligent monitoring API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "pyjwt>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.9,<1",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "cryptography>=43,<46",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
edge = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "supervision>=0.24,<1",
  "tritonclient[http]>=2.50,<3",
  "nvidia-ml-py>=12,<13",
]

[project.scripts]
mineguard-edge = "app.edge.cli:main"
mineguard-edge-outbox = "app.edge.outbox_cli:main"
mineguard-rotate-camera-urls = "app.rotate_camera_urls:main"
mineguard-rotate-face-templates = "app.rotate_face_templates:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"app/dependencies.py" = ["B008"]
"app/main.py" = ["B008"]
"tests/conftest.py" = ["E402"]
